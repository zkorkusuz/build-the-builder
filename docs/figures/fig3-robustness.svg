<text x="40.0" y="469.0" font-size="10.5" text-anchor="start" fill="#4a5160">&quot;3 of 3&quot; = three repetitions, a customer counts only when all three pass; the other bars are single runs.</text>
<text x="40.0" y="492.0" font-size="10" text-anchor="start" fill="#4a5160">(a) pieces v28: half a date of birth looped the identity step. v30: the prompt said to ask for the rest before calling the tool. v40: the model's own wrong join of 14 March + 1988, and a Sunday-morning</text>
<text x="40.0" y="505.0" font-size="10" text-anchor="start" fill="#4a5160">callback. v42: platform sandbox fault. v46 (3 of 3): one sandbox fault and the 'Monday 2' parser bug, fixed in v48. corrects v30: one lost bank request and one missing judge analysis.</text>
<text x="40.0" y="522.0" font-size="10" text-anchor="start" fill="#4a5160">(b) v28 misses on both days were a wrong expectation in the test renderer, since fixed. Holiday eve v46: the simulator persona cut its own line short.</text>
<text x="40.0" y="539.0" font-size="10" text-anchor="start" fill="#4a5160">(c) Rebuilt 11/13: the refusal count lived in the extractor; moving it into a code step gave 13/13 in all three repetitions. Final code re-run at Sun 10:20.</text>
