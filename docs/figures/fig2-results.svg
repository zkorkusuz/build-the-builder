<text x="70.0" y="528.0" font-size="10.5" text-anchor="start" fill="#4a5160">Numbers above the points: the fix that went in before that run (list below). Under the points: customers right in each of the three repetitions.</text>
<text x="30.0" y="556.0" font-size="12" text-anchor="start" fill="#1c2230" font-weight="bold">Fix that went in before each run</text>
<text x="30.0" y="578.0" font-size="10.5" text-anchor="start" fill="#1c2230">1. v9 (run 4, Sat 23:35): full pipeline (normalize, render, adapt)</text>
<text x="30.0" y="598.0" font-size="10.5" text-anchor="start" fill="#1c2230">2. v12 (run 7, Sun 00:05): refusal count, callback window hook, dispute reason via transitions</text>
<text x="30.0" y="618.0" font-size="10.5" text-anchor="start" fill="#1c2230">3. v21 (run 10, Sun 01:05): opening ask chain counts asks in structure; callback words</text>
<text x="30.0" y="632.0" font-size="10.5" text-anchor="start" fill="#1c2230">converted in the hook; weekend table</text>
<text x="30.0" y="652.0" font-size="10.5" text-anchor="start" fill="#1c2230">4. v25 (run 11, Sun 01:27): close_call moved inside the call flow; refusal count in a code step</text>
<text x="30.0" y="672.0" font-size="10.5" text-anchor="start" fill="#1c2230">5. v27 (run 12, Sun 01:44): vague period routed to a code step that writes the next instruction</text>
<text x="30.0" y="692.0" font-size="10.5" text-anchor="start" fill="#1c2230">6. v28 (run 13, Sun 01:57): days said in words resolved in code (never by the model)</text>
<text x="30.0" y="712.0" font-size="10.5" text-anchor="start" fill="#1c2230">7. v40 (run 20, Sun 08:45): split answers joined in the verify hook; blocked calls send an</text>
<text x="30.0" y="726.0" font-size="10.5" text-anchor="start" fill="#1c2230">invalid body; wants_person value</text>
<text x="620.0" y="578.0" font-size="10.5" text-anchor="start" fill="#1c2230">8. v42 (run 23, Sun 09:20): date answers joined by parts; callback day outside the window</text>
<text x="620.0" y="592.0" font-size="10.5" text-anchor="start" fill="#1c2230">counts; ISO date stripped before time</text>
<text x="620.0" y="612.0" font-size="10.5" text-anchor="start" fill="#1c2230">9. v44 (run 24, Sun 09:55): identical-promise guard</text>
<text x="620.0" y="632.0" font-size="10.5" text-anchor="start" fill="#1c2230">10. v46 (run 25, Sun 10:00): promise guard uses the normalized date</text>
<text x="620.0" y="652.0" font-size="10.5" text-anchor="start" fill="#1c2230">11. v48 (run 32, Sun 10:45): weekday plus day number parser ('Monday 2' = 2 November)</text>
<text x="620.0" y="672.0" font-size="10.5" text-anchor="start" fill="#1c2230">12. v50 (run 33, Sun 11:00): time of day stripped before day numbers</text>
<text x="620.0" y="692.0" font-size="10.5" text-anchor="start" fill="#1c2230">13. v52 (run 35, Sun 13:07): identity prompt: never fill in a part the customer did not say</text>
<text x="620.0" y="706.0" font-size="10.5" text-anchor="start" fill="#1c2230">(running now)</text>
</svg>
